media:
  - name: membros
    label: Fotos dos membros
    input: public/img/membros
    output: /img/membros
    categories: [image]
    rename: safe
  - name: projetos
    label: Imagens dos projetos
    input: public/img
    output: /img
    categories: [image]
    rename: safe

content:
  - name: membros
    label: Membros
    description: Cadastre e edite as pessoas exibidas na seção "Membros".
    type: collection
    path: app/data/membros
    format: json
    filename: "{nome}.json"
    subfolders: false
    view:
      primary: nome
      fields: [foto, nome, curso]
      search: [nome, email]
      sort: [nome, curso]
      default:
        sort: nome
        order: asc
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: curso
        label: Curso
        type: select
        required: true
        options:
          values:
            - Ciência da Computação
            - Ciência de Dados
            - Engenharia Biomédica
            - Jogos Digitais
            - PPG Nanociências
            - Professor Orientador
            - Egresso
      - name: email
        label: E-mail
        type: string
        required: true
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Informe um e-mail válido.
      - name: foto
        label: Foto
        type: image
        options:
          media: membros
      - name: instagram
        label: Instagram
        type: string
        description: URL completa. Deixe vazio se não tiver.
      - name: github
        label: GitHub
        type: string
        description: URL completa. Deixe vazio se não tiver.
      - name: lattes
        label: Lattes
        type: string
        description: URL completa. Deixe vazio se não tiver.

  - name: projetos
    label: Projetos
    description: Gerencie os projetos exibidos na página inicial e no catálogo do laboratório.
    type: collection
    path: app/data/projetos
    format: json
    filename: "{slug}.json"
    subfolders: false
    view:
      primary: titulo
      fields: [thumbnail, titulo, tag, ordem]
      search: [titulo, descricao]
      sort: [ordem, titulo, tag]
      default:
        sort: ordem
        order: asc
    fields:
      - name: ordem
        label: Ordem de exibição
        type: number
        required: true
        description: Projetos com números menores aparecem primeiro.
      - name: titulo
        label: Título
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: Endereço da página (/projetos/slug). Só minúsculas e hifens.
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use apenas minúsculas, números e hifens.
      - name: tag
        label: Categoria
        type: string
        required: true
        description: "Exibida em caixa alta acima do título (ex.: robótica)."
      - name: descricao
        label: Descrição curta
        type: text
        required: true
        description: Usada nos cards e na meta description da página.
      - name: conteudo
        label: Texto do projeto
        type: text
        list: true
        description: Adicione um parágrafo por campo, na ordem em que deve aparecer.
      - name: thumbnail
        label: Capa
        type: image
        required: true
        options:
          media: projetos
      - name: imagens
        label: Imagens da galeria
        type: image
        list: true
        options:
          media: projetos
