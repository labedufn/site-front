media:
  - name: membros
    label: Fotos dos membros
    input: public/img/membros
    output: /img/membros
    categories: [image]
    rename: safe
  - name: projetos
    label: Imagens dos projetos
    input: public/img
    output: /img
    categories: [image]
    rename: safe

content:
  - name: membros
    label: Membros
    description: Equipe exibida na seção "Membros". A ordem alfabética é aplicada pelo site.
    type: file
    path: app/data/membros.json
    format: json
    list: true
    view:
      primary: nome
      fields: [foto, nome, curso]
      search: [nome, email]
      sort: [nome, curso]
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: curso
        label: Curso
        type: select
        required: true
        options:
          values:
            - Ciência da Computação
            - Ciência de Dados
            - Engenharia Biomédica
            - Jogos Digitais
            - PPG Nanociências
            - Professor Orientador
            - Egresso
      - name: email
        label: E-mail
        type: string
        required: true
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Informe um e-mail válido.
      - name: foto
        label: Foto
        type: image
        options:
          media: membros
      - name: instagram
        label: Instagram
        type: string
        description: URL completa. Deixe vazio se não tiver.
      - name: github
        label: GitHub
        type: string
        description: URL completa. Deixe vazio se não tiver.
      - name: lattes
        label: Lattes
        type: string
        description: URL completa. Deixe vazio se não tiver.

  - name: projetos
    label: Projetos
    description: Projetos do laboratório, exibidos na home e em /projetos/{slug}.
    type: file
    path: app/data/projetos.json
    format: json
    list: true
    view:
      primary: titulo
      fields: [thumbnail, titulo, tag]
      search: [titulo, descricao]
      sort: [titulo, tag]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: Endereço da página (/projetos/slug). Só minúsculas e hifens.
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use apenas minúsculas, números e hifens.
      - name: tag
        label: Categoria
        type: string
        required: true
        description: Exibida em caixa alta acima do título (ex.- robótica).
      - name: descricao
        label: Descrição curta
        type: text
        required: true
        description: Usada nos cards e na meta description da página.
      - name: conteudo
        label: Parágrafos
        type: text
        list: true
        description: Um item por parágrafo do texto da página do projeto.
      - name: thumbnail
        label: Capa
        type: image
        required: true
        options:
          media: projetos
      - name: imagens
        label: Galeria
        type: image
        list: true
        options:
          media: projetos
